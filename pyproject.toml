[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lit-cli"
version = "0.1.0"
description = "A beautiful Letterboxd client for your terminal."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"

authors = [
  {name = "flamex"}
]

keywords = [
  "letterboxd",
  "movies",
  "terminal",
  "cli",
  "tui"
]

dependencies = [
    "rich",
    "requests",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Environment :: Console",
    "Operating System :: OS Independent"
]

[project.scripts]
lit = "lit.main:main"
[tool.hatch.build.targets.wheel]
packages = ["lit"]

[tool.hatch.build.targets.sdist]
include = [
    "/lit",
    "/README.md",
    "/LICENSE",
]